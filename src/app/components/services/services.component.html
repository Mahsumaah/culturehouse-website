<section class="services" id="services">
  <div class="services__container">
    <h2 class="services__title">{{ 'SERVICES.TITLE' | translate }}</h2>
    <div class="services__content">
      <p class="services__paragraph">{{ 'SERVICES.DESCRIPTION' | translate }}</p>
      <a href="#connect" class="services__cta">
        {{ 'SERVICES.CONNECT' | translate }}
        <svg class="services__arrow" width="27" height="24" viewBox="0 0 27 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 12H22" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M15 5L22 12L15 19" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <!-- Services Listing -->
      <div class="services__listing">
        <!-- Column 1 -->
        <div class="services__column">
          @for (service of columnOneServices; track service.id) {
            <div class="services__item">
              <span class="services__bullet"><img src="assets/bullet-point.svg" alt=""></span>
              {{ service.name | translate }}
            </div>
            <hr class="services__divider">
          }
        </div>

        <!-- Column 2 -->
        <div class="services__column">
          @for (service of columnTwoServices; track service.id) {
            <div class="services__item">
              <span class="services__bullet"><img src="assets/bullet-point.svg" alt=""></span>
              {{ service.name | translate }}
            </div>
            <hr class="services__divider">
          }
        </div>
      </div>
    </div>
  </div>
</section>
