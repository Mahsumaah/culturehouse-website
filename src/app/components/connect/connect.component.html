<section class="connect" id="contact">
  <div class="connect__container">
    <h2 class="connect__title">{{ 'CONNECT.TITLE' | translate }}</h2>

    <div class="connect__social-icons">
      <a href="mailto:info@culturehouse.com" class="connect__icon" aria-label="Email">
        <img src="assets/social/mail-culture-house.png" alt="Email" class="social-icon">
      </a>

      <a href="tel:+123456789" class="connect__icon" aria-label="Phone">
        <img src="assets/social/call-culture-house.png" alt="Phone" class="social-icon">
      </a>

      <a href="https://instagram.com/culturehouse" target="_blank" class="connect__icon" aria-label="Instagram">
        <img src="assets/social/instagram-culture-house.png" alt="Instagram" class="social-icon">
      </a>

      <a href="https://x.com/culturehouse" target="_blank" class="connect__icon" aria-label="X (Twitter)">
        <img src="assets/social/x-culture-house.png" alt="X (Twitter)" class="social-icon">
      </a>

      <a href="https://linkedin.com/company/culturehouse" target="_blank" class="connect__icon" aria-label="LinkedIn">
        <img src="assets/social/linkedIn-culture-house.png" alt="LinkedIn" class="social-icon">
      </a>
    </div>

    <div class="connect__copyright">
      {{ 'CONNECT.COPYRIGHT' | translate }}
    </div>
  </div>
</section>
