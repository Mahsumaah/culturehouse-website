<section class="hero">
  <nav class="nav">
    <div class="nav__container">
      <div class="nav__logo" [class.hidden]="isMenuOpen">
        <img src="assets/culture-house-logo.svg" alt="Culture House Logo" width="93" height="131">
      </div>

      <!-- Desktop horizontal menu - new addition -->
      <div class="nav__desktop-menu">
        <ul class="nav__menu-items">
          <li><a href="#" class="nav__menu-link">Home</a></li>
          <li><a href="#about" class="nav__menu-link">About</a></li>
          <li><a href="#work" class="nav__menu-link">Recent Work</a></li>
          <li><a href="#services" class="nav__menu-link">Services</a></li>
          <li><a href="#help" class="nav__menu-link">How we can help</a></li>
          <li><a href="#contact" class="nav__menu-link">Contact</a></li>
        </ul>
        <div class="nav__lang-switcher">
          <div class="nav__lang-label">EN</div>
          <img src="assets/lang-switch.svg" alt="Culture House Language switch" width="16" height="17">
        </div>
      </div>

      <!-- Mobile burger menu -->
      <button class="burger-menu" [class.burger-menu--open]="isMenuOpen" aria-label="Toggle menu" (click)="toggleMenu()">
        <span class="burger-menu__line"></span>
        <span class="burger-menu__line"></span>
        <span class="burger-menu__line"></span>
      </button>
    </div>
  </nav>

  <div class="fullscreen-menu" [class.fullscreen-menu--open]="isMenuOpen">
    <nav class="fullscreen-menu__nav">
      <a href="#" class="fullscreen-menu__item" (click)="closeMenu()">Home</a>
      <hr class="fullscreen-menu__divider">

      <a href="#about" class="fullscreen-menu__item" (click)="closeMenu()">About</a>
      <hr class="fullscreen-menu__divider">

      <a href="#work" class="fullscreen-menu__item" (click)="closeMenu()">Recent Work</a>
      <hr class="fullscreen-menu__divider">

      <a href="#services" class="fullscreen-menu__item" (click)="closeMenu()">Services</a>
      <hr class="fullscreen-menu__divider">

      <a href="#help" class="fullscreen-menu__item" (click)="closeMenu()">How we can help</a>
      <hr class="fullscreen-menu__divider">

      <a href="#contact" class="fullscreen-menu__item" (click)="closeMenu()">Contact</a>
      <div class="fullscreen-menu__lang-switcher">
        <img src="assets/lang-switch.svg" alt="Culture House Language switch" width="27" height="30">
        <div class="">EN</div>
      </div>
    </nav>
  </div>

  <div class="hero__content">
    <h1 class="hero__title">A home for cultural story gathering and curated narrative amplification.</h1>
    <a href="#connect" class="hero__cta">
      Let's connect
      <svg class="hero__arrow" width="27" height="24" viewBox="0 0 27 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 12H22" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 5L22 12L15 19" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </div>

  <div class="hero__video-container">
    <video class="hero__video" autoplay muted loop playsinline>
      <source src="assets/ch-main-video.mp4" type="video/mp4">
    </video>
  </div>
</section>
